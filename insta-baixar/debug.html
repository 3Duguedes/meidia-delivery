<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InstaBaixar — Diagnóstico</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
  input { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; }
  button { padding: 10px 16px; font-size: 1rem; margin-top: 8px; cursor: pointer; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f3f3f3; padding: 12px; border-radius: 8px; font-size: 0.8rem; max-height: 70vh; overflow: auto; }
</style>
</head>
<body>
  <h2>🔧 Diagnóstico InstaBaixar</h2>
  <p>Cole o link do Instagram e clique no botão — não precisa montar URL nenhuma.</p>
  <input id="link" type="url" placeholder="https://www.instagram.com/reel/..." />
  <br />
  <button id="btnJson">Ver resposta da função (JSON)</button>
  <button id="btnRaw">Ver HTML bruto do Instagram</button>
  <pre id="out">O resultado aparece aqui.</pre>

  <script>
    const linkInput = document.getElementById("link");
    const out = document.getElementById("out");

    async function run(raw) {
      const link = linkInput.value.trim();
      if (!link) { out.textContent = "Cole um link primeiro."; return; }
      out.textContent = "Carregando...";
      const params = new URLSearchParams({ url: link });
      if (raw) params.set("raw", "1");
      try {
        const res = await fetch(`/.netlify/functions/get-media?${params.toString()}`);
        const text = await res.text();
        out.textContent = `HTTP ${res.status}\n\n${text}`;
      } catch (err) {
        out.textContent = "Erro ao chamar a função: " + err.message;
      }
    }

    document.getElementById("btnJson").addEventListener("click", () => run(false));
    document.getElementById("btnRaw").addEventListener("click", () => run(true));
  </script>
</body>
</html>
